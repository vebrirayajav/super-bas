      <!-- ===== FETCH INTERCEPTOR: Redirect API ke URL baru ===== -->
      <script>
      (function() {
        // URL LAMA yang di-hardcode di JS bundle (JANGAN DIUBAH)
        var OLD_API = "https://script.google.com/macros/s/AKfycbyU-XM9W6BurTEPTzjiKOPaKbXG83EOI9oScoZdgtUVL1dj3EvYIMtWQwLeXqG2UeTB/exec";

        // ╔══════════════════════════════════════════════════════════╗
        // ║  GANTI URL DI BAWAH DENGAN URL WEB APP BARU ANDA       ║
        // ║  Setelah deploy Google Apps Script, paste URL-nya disini ║
        // ║  Atau ganti via menu Pengaturan API di owner.html       ║
        // ╚══════════════════════════════════════════════════════════╝
        var DEFAULT_NEW_API = "https://script.google.com/macros/s/AKfycbzyZ5HEZl9zGYTS28kEIqO8ovJAUArsLkeobDZQWW0sUP-CDyY3GoL0FZnxisBcL-Y1/exec";
        var NEW_API = localStorage.getItem('bas_api_url') || DEFAULT_NEW_API;

        var _originalFetch = window.fetch;
        window.fetch = function(url, options) {
          var urlStr = typeof url === "string" ? url : (url && url.url ? url.url : String(url));

          // ===== OWNER / KORLAP LOGIN INTERCEPTOR =====
          // Cek login terhadap sheet DataOwner via API
          try {
            if (options && options.body) {
              var parsed = JSON.parse(options.body);
              if (parsed.action === 'login') {
                var oid = (parsed.opsId || '').replace(/^OPS/i,'').trim();
                var nk = (parsed.nik || '').trim();

                // Call API to check DataOwner sheet
                var ownerCheckUrl = NEW_API;
                return _originalFetch.call(window, ownerCheckUrl, {
                  method: 'POST',
                  headers: {'Content-Type':'text/plain;charset=utf-8'},
                  body: JSON.stringify({ action:'loginOwner', opsId: oid, nik: nk })
                }).then(function(resp) {
                  return resp.json();
                }).then(function(data) {
                  if (data && data.isOwner) {
                    // Found in DataOwner sheet — store profile & redirect
                    console.log('[BAS] Owner/Korlap login detected →', data.status, '| station:', data.station);
                    sessionStorage.setItem('bas_owner_auth', 'true');
                    sessionStorage.setItem('bas_owner_profile', JSON.stringify({
                      ops: data.ops,
                      nama: data.nama,
                      station: data.station,
                      status: data.status,
                      wa: data.wa
                    }));
                    window.location.href = 'owner.html';
                    return new Response(JSON.stringify({block:true}), {status:200});
                  }
                  // Not owner/korlap — proceed with normal employee login
                  var newUrl2 = urlStr.indexOf(OLD_API) !== -1 ? urlStr.replace(OLD_API, NEW_API) : urlStr;
                  return _originalFetch.call(window, newUrl2, options);
                }).catch(function(err) {
                  console.warn('[BAS] Owner check failed, falling back to normal login:', err);
                  var newUrl3 = urlStr.indexOf(OLD_API) !== -1 ? urlStr.replace(OLD_API, NEW_API) : urlStr;
                  return _originalFetch.call(window, newUrl3, options);
                });
              }
            }
          } catch(ex) {}

          // Intercept jika URL mengandung OLD_API
          if (urlStr.indexOf(OLD_API) !== -1) {
            var newUrl = urlStr.replace(OLD_API, NEW_API);
            // Parse body untuk logging
            var action = "?";
            try {
              if (options && options.body) {
                var b = JSON.parse(options.body);
                action = b.action || "?";
              }
            } catch(e) {}
            console.log("[BAS-API] " + action + " → redirected to new URL");

            return _originalFetch.call(this, newUrl, options).then(function(resp) {
              console.log("[BAS-API] " + action + " → status " + resp.status);
              return resp;
            }).catch(function(err) {
              console.error("[BAS-API] " + action + " → ERROR:", err);
              throw err;
            });
          }

          return _originalFetch.apply(this, arguments);
        };
        console.log("[BAS] Fetch interceptor aktif → API dialihkan ke URL baru");
        window.__basInterceptorActive = true;
      })();
      </script>
    <style>
      /* ===== BASE STYLES ===== */

        font-family: 'Open Sans', sans-serif !important;

      /* ===== PRELOADER / LOADING SCREEN ===== */

        background: linear-gradient(135deg, #f0f4ff 0%, #f5f3ff 50%, #f5f3ff 100%);
      }

      /* === Animated background mesh === */
      .pl-bg-mesh {
        position: absolute; inset: 0; overflow: hidden; pointer-events: none;
      }
      .pl-bg-mesh::before, .pl-bg-mesh::after {
        content: ''; position: absolute; border-radius: 50%;
        filter: blur(80px); opacity: 0.4;
        animation: pl-mesh-float 8s ease-in-out infinite;
      }
      .pl-bg-mesh::before {
        width: 400px; height: 400px;
        background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
        top: -100px; left: -100px;
      }
      .pl-bg-mesh::after {
        width: 350px; height: 350px;
        background: radial-gradient(circle, #4cc9f0 0%, transparent 70%);
        bottom: -80px; right: -80px;
        animation-delay: -4s; animation-direction: reverse;
      }
      html.light-mode .pl-bg-mesh::before {
        background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
        opacity: 0.6;
      }
      html.light-mode .pl-bg-mesh::after {
        background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);
        opacity: 0.6;
      }

      /* === Grid pattern overlay === */
      .pl-grid {
        position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(124,58,237,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(124,58,237,0.06) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: pl-grid-scroll 20s linear infinite;
      }
      html.light-mode .pl-grid {
        background-image:
          linear-gradient(rgba(99,102,241,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99,102,241,0.06) 1px, transparent 1px);
      }

      /* === Center piece: Hexagon container === */
      .pl-hex-wrap {
        position: relative;
        width: 180px; height: 180px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 32px;
      }

      /* Rotating hexagon outlines */
      .pl-hex {
        position: absolute; inset: 0;
      }
      .pl-hex svg {
        width: 100%; height: 100%;
        animation: pl-hex-rotate 6s linear infinite;
      }
      .pl-hex svg polygon {
        fill: none;
        stroke: url(#pl-grad1);
        stroke-width: 1.5;
        stroke-dasharray: 360;
        stroke-dashoffset: 720;
        animation: pl-hex-draw 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pl-hex-inner svg {
        animation: pl-hex-rotate 4s linear infinite reverse;
      }
      .pl-hex-inner svg polygon {
        stroke: url(#pl-grad2);
        stroke-width: 1;
        animation-delay: -1.5s;
      }

      /* Orbiting satellites */
      .pl-orbit {
        position: absolute; inset: -24px;
        animation: pl-hex-rotate 3s linear infinite;
      }
      .pl-satellite {
        position: absolute; top: -4px; left: 50%;
        width: 8px; height: 8px; border-radius: 50%;
        background: #4cc9f0;
        box-shadow: 0 0 16px #4cc9f0, 0 0 32px rgba(76,201,240,0.5), 0 0 48px rgba(76,201,240,0.2);
        transform: translateX(-50%);
      }
      .pl-satellite::after {
        content: ''; position: absolute;
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle, rgba(76,201,240,0.3), transparent);
        animation: pl-sat-pulse 1s ease-in-out infinite;
      }
      .pl-orbit:nth-child(5) {
        inset: -36px;
        animation-duration: 5s; animation-direction: reverse;
      }
      .pl-orbit:nth-child(5) .pl-satellite {
        width: 5px; height: 5px;
        background: #f72585;
        box-shadow: 0 0 12px #f72585, 0 0 24px rgba(247,37,133,0.4);
      }
      html.light-mode .pl-satellite {
        background: #6366f1;
        box-shadow: 0 0 16px rgba(99,102,241,0.6), 0 0 32px rgba(99,102,241,0.3);
      }
      html.light-mode .pl-orbit:nth-child(5) .pl-satellite {
        background: #a855f7;
        box-shadow: 0 0 12px rgba(168,85,247,0.5), 0 0 24px rgba(168,85,247,0.2);
      }

      /* Center core with glassmorphism */
      .pl-core {
        position: relative; z-index: 2;
        width: 120px; height: 48px; border-radius: 24px;
        background: rgba(16,0,43,0.85);
        backdrop-filter: blur(20px);

      }
      html.light-mode .pl-core {

        box-shadow: 0 4px 24px rgba(99,102,241,0.12), 0 0 60px rgba(139,92,246,0.06),
                    inset 0 0 20px rgba(99,102,241,0.04);
      }

      /* BAS glitch text */
      .pl-title {
        font-family: 'Open Sans', sans-serif !important;
        font-size: 15px; font-weight: 900;
        letter-spacing: 2.5px;
        color: #fff;
        position: relative;
        text-shadow: 0 0 20px rgba(124,58,237,0.5);

      .pl-title::before, .pl-title::after {

      }
      .pl-title::before {

      }
      .pl-title::after {
        color: #f72585; z-index: -2;

      }
      html.light-mode .pl-title {

        text-shadow: none;
      }
      html.light-mode .pl-title::before { color: #6366f1; }
      html.light-mode .pl-title::after { color: #a855f7; }

      /* Company name with reveal */
      .pl-company {
        font-family: 'Open Sans', sans-serif !important;
        font-size: 9px; font-weight: 700;
        letter-spacing: 5px; text-transform: uppercase;

      }
      .pl-company::after {
        content: ''; position: absolute;

        background: linear-gradient(90deg, transparent, rgba(76,201,240,0.15), transparent);
        animation: pl-shimmer 2.5s ease-in-out infinite;
      }
      html.light-mode .pl-company {
        color: rgba(71,85,105,0.45);
      }
      html.light-mode .pl-company::after {
        background: linear-gradient(90deg, transparent, rgba(99,102,241,0.1), transparent);
      }

      /* Progress bar */
      .pl-progress-wrap {
        width: 180px; height: 2.5px;
        background: rgba(255,255,255,0.06);
        border-radius: 4px; overflow: hidden;
        position: relative;
      }
      html.light-mode .pl-progress-wrap {
        background: rgba(99,102,241,0.08);
      }
      .pl-progress-bar {
        height: 100%; width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #4cc9f0, #7c3aed, #f72585);
        background-size: 200% 100%;
        animation: pl-progress-fill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,

        box-shadow: 0 0 12px rgba(99,102,241,0.3);

        color: rgba(71,85,105,0.3);
      }

      /* Floating code particles */
      .pl-code-particle {
        position: absolute; pointer-events: none;
        font-family: monospace; font-size: 10px;
        color: rgba(76,201,240,0.12);
        animation: pl-code-fall linear infinite;

      }
      html.light-mode .pl-code-particle {
        color: rgba(99,102,241,0.08);
      }

      /* === Keyframes === */
      @keyframes pl-mesh-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(60px, -40px) scale(1.15); }
        66% { transform: translate(-40px, 30px) scale(0.9); }
      }
      @keyframes pl-grid-scroll {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, 40px); }
      }
      @keyframes pl-hex-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pl-hex-draw {
        0% { stroke-dashoffset: 720; opacity: 0.3; }
        50% { stroke-dashoffset: 360; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes pl-core-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(124,58,237,0.2), 0 0 80px rgba(76,201,240,0.1), inset 0 0 30px rgba(124,58,237,0.15); }
        50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(124,58,237,0.35), 0 0 100px rgba(76,201,240,0.15), inset 0 0 40px rgba(124,58,237,0.2); }
      }
      @keyframes pl-sat-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
      }
      @keyframes pl-glitch-1 {
        0%, 90%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        92% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 1px); }
        94% { clip-path: inset(50% 0 20% 0); transform: translate(3px, -1px); }
        96% { clip-path: inset(10% 0 70% 0); transform: translate(-2px, 2px); }
      }
      @keyframes pl-glitch-2 {
        0%, 88%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        90% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        93% { clip-path: inset(30% 0 40% 0); transform: translate(-2px, 1px); }
        95% { clip-path: inset(70% 0 5% 0); transform: translate(1px, -2px); }
      }
      @keyframes pl-shimmer {
        0% { left: -100%; }
        100% { left: 200%; }
      }
      @keyframes pl-progress-fill {
        0% { width: 0%; }
        20% { width: 25%; }
        50% { width: 55%; }
        80% { width: 80%; }
        100% { width: 95%; }
      }
      @keyframes pl-progress-glow {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      @keyframes pl-status-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes pl-code-fall {
        0% { transform: translateY(-20px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }

      @keyframes blob-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .animate-blob { animation: blob-float 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1); }
      .animate-blob-reverse { animation: blob-float 25s infinite alternate-reverse cubic-bezier(0.45, 0, 0.55, 1); }
      .scanline-effect {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, transparent, rgba(76, 201, 240, 0.05), transparent);
        height: 10%; width: 100%; pointer-events: none;
        animation: scanline 8s linear infinite; z-index: 5;
      }

      /* ===== THEME TOGGLE — iOS PILL SWITCH ===== */
      #theme-toggle-btn {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 99999;
        width: 68px;
        height: 36px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        padding: 3px;
        transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.25), 0 2px 12px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }
      #theme-toggle-btn:hover {
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.25), 0 4px 20px rgba(0,0,0,0.3);
        transform: none;
      }
      #theme-toggle-btn:active { transform: scale(0.96); }
      /* Thumb (circle) */
      #theme-toggle-btn .toggle-thumb {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease;
        box-shadow: 0 2px 8px rgba(79,70,229,0.4);
        position: relative;
        transform: translateX(0);
      }
      #theme-toggle-btn .toggle-thumb .icon-sun,
      #theme-toggle-btn .toggle-thumb .icon-moon {
        position: absolute;
        font-size: 16px;
        transition: all 0.35s ease;
        line-height: 1;
      }
      /* Dark mode (default): thumb LEFT, show sun */
      #theme-toggle-btn .toggle-thumb .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
      #theme-toggle-btn .toggle-thumb .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0); }

      html.light-mode #theme-toggle-btn .toggle-thumb {
        transform: translateX(32px);
        background: linear-gradient(135deg, #6366f1, #818cf8);
        box-shadow: 0 2px 8px rgba(99,102,241,0.5);
      }
      html.light-mode #theme-toggle-btn .toggle-thumb .icon-sun { opacity: 0; transform: rotate(90deg) scale(0); }
      html.light-mode #theme-toggle-btn .toggle-thumb .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
      /* Remove old tooltip */
      #theme-toggle-btn::after { display: none !important; }

      /* Hide login NIK tip text */
      .max-w-sm p.text-\[9px\].text-slate-400 { display: none !important; }

        background: rgba(99,102,241,0.15);

      /* =============================================
         NUCLEAR OPTION: Force ALL divs in #root
         to have proper light backgrounds & text
         ============================================= */

      html.light-mode .bg-\[\#10002b\],
      html.light-mode .bg-\[\#1a0b2e\],
      html.light-mode .bg-\[\#240046\],

      html.light-mode .bg-\[\#7209b7\],
      html.light-mode .bg-\[\#7b2cbf\]  { background-color: #8b5cf6 !important; }
      html.light-mode .bg-\[\#4cc9f0\]  { background-color: #4cc9f0 !important; }
      html.light-mode .bg-\[\#f72585\]  { background-color: #6366f1 !important; }

    <script>
    (function() {
      var preloader = document.getElementById('bas-preloader');
      if (!preloader) return;
      var progressBar = preloader.querySelector('.pl-progress-bar');
      var statusText = preloader.querySelector('.pl-status');
      var messages = ['Memuat Sistem', 'Menyiapkan Data', 'Hampir Selesai'];
      var msgIdx = 0;
      var msgInterval = setInterval(function() {
        msgIdx++;
        if (msgIdx < messages.length && statusText) {
          statusText.textContent = messages[msgIdx];
        }
      }, 900);

      function hidePreloader() {
        clearInterval(msgInterval);
        if (progressBar) {
          progressBar.style.transition = 'width 0.3s ease';
          progressBar.style.width = '100%';
        }
        if (statusText) statusText.textContent = 'Selesai';
        setTimeout(function() {
          preloader.classList.add('hide');
          setTimeout(function() { preloader.remove(); }, 900);
        }, 350);
      }
      var root = document.getElementById('root');
      var observer = new MutationObserver(function() {
        if (root.children.length > 0) {
          observer.disconnect();
          setTimeout(hidePreloader, 500);
        }
      });
      observer.observe(root, { childList: true });
      setTimeout(hidePreloader, 5000);
    })();
    </script>

    <script>
      (function() {
        'use strict';
        
        const STORAGE_KEY = 'bas-theme-mode';
        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle-btn');
        const overlay = document.getElementById('theme-overlay');
        
        function getStoredTheme() {
          try { return localStorage.getItem(STORAGE_KEY); } catch(e) { return null; }
        }
        function setStoredTheme(mode) {
          try { localStorage.setItem(STORAGE_KEY, mode); } catch(e) {}
        }

        // Color mapping: dark → light
        const bgColorMap = {
          'rgb(16, 0, 43)': '#f7f8fc',
          'rgb(26, 11, 46)': '#f7f8fc',
          'rgb(36, 0, 70)': '#f1f5f9',
          'rgb(60, 9, 108)': '#eef2ff',
          'rgb(114, 9, 183)': '#8b5cf6',
          'rgb(123, 44, 191)': '#8b5cf6',
          'rgb(0, 0, 0)': '#f7f8fc',
        };

        // Aggressive: patch ALL elements with dark backgrounds
        function patchInlineStyles() {
          if (!html.classList.contains('light-mode')) return;
          
          document.querySelectorAll('#root *').forEach(el => {
            // Skip all elements inside <header>, z-50 modals, and ID card — handled by CSS
            if (el.closest('header') || el.closest('.fixed.inset-0.z-50') || el.closest('#card-capture-target')) return;
            const s = el.style;
            const cs = window.getComputedStyle(el);
            
            // 1. Patch explicit inline bg-color
            if (s.backgroundColor && bgColorMap[s.backgroundColor]) {
              if (!el.dataset._origBg) el.dataset._origBg = s.backgroundColor;
              s.backgroundColor = bgColorMap[s.backgroundColor];
            }
            
            // 2. Patch background (gradients with dark colors)
            if (s.background) {
              let bg = s.background;
              let changed = false;
              for (const [dark, light] of Object.entries(bgColorMap)) {
                if (bg.includes(dark)) {
                  if (!el.dataset._origBgFull) el.dataset._origBgFull = bg;
                  bg = bg.replaceAll(dark, light);
                  changed = true;
                }
              }
              if (changed) s.background = bg;
            }
            
            // 3. Patch backgroundImage (gradient overlays)
            if (s.backgroundImage) {
              let bgi = s.backgroundImage;
              let changed = false;
              for (const [dark, light] of Object.entries(bgColorMap)) {
                if (bgi.includes(dark)) {
                  if (!el.dataset._origBgi) el.dataset._origBgi = bgi;
                  bgi = bgi.replaceAll(dark, light);
                  changed = true;
                }
              }
              if (changed) s.backgroundImage = bgi;
            }

            // 4. Patch white text on light backgrounds
            if (s.color === 'rgb(255, 255, 255)' || s.color === 'white') {
              // Don't patch text inside gradient colored cards — it should stay white
              var inGradientCard = el.closest('[class*="bg-gradient-to-r"][class*="from-[#240046]"]') ||
                                   el.closest('[class*="bg-gradient-to-br"][class*="from-[#240046]"]') ||
                                   el.closest('[class*="bg-gradient-to-r"][class*="from-[#3c096c]"]');
              if (!inGradientCard) {
                if (!el.dataset._origColor) el.dataset._origColor = s.color;
                s.color = '#1e293b';
              }
            }

            // 5. Detect computed dark backgrounds (catches Tailwind classes applied via className)
            const compBg = cs.backgroundColor;
            if (compBg && bgColorMap[compBg] && !s.backgroundColor) {
              // These are class-based, CSS should handle them
              // But add data attr for verification
            }
          });

          // 6. NUCLEAR: force all text in info cards to be visible
          document.querySelectorAll('[class*="bg-[#240046]/30"] span, [class*="bg-[#240046]/30"] p').forEach(el => {
            const cls = el.className || '';
            el.setAttribute('data-nuc', '1');
            // Preserve accent colors
            if (cls.includes('text-[#f72585]')) { el.style.setProperty('color', '#6366f1', 'important'); }
            else if (cls.includes('text-[#4cc9f0]')) { el.style.setProperty('color', '#4cc9f0', 'important'); }
            else if (cls.includes('text-[#00f5d4]') || cls.includes('text-[#00F5D4]')) { el.style.setProperty('color', '#059669', 'important'); }
            else if (cls.includes('text-slate-400')) { el.style.setProperty('color', '#64748b', 'important'); }
            else if (cls.includes('text-slate-500')) { el.style.setProperty('color', '#94a3b8', 'important'); }
            else { el.style.setProperty('color', '#1e293b', 'important'); }
          });
        }

        function unpatchInlineStyles() {
          // Restore original background colors
          document.querySelectorAll('#root [data-_orig-bg]').forEach(el => {
            el.style.backgroundColor = el.dataset._origBg;
            delete el.dataset._origBg;
          });
          document.querySelectorAll('#root [data-_orig-bg-full]').forEach(el => {
            el.style.background = el.dataset._origBgFull;
            delete el.dataset._origBgFull;
          });
          document.querySelectorAll('#root [data-_orig-bgi]').forEach(el => {
            el.style.backgroundImage = el.dataset._origBgi;
            delete el.dataset._origBgi;
          });
          document.querySelectorAll('#root [data-_orig-color]').forEach(el => {
            el.style.color = el.dataset._origColor;
            delete el.dataset._origColor;
          });
          // Clean up ALL nuclear-patched info card text
          document.querySelectorAll('#root [data-nuc]').forEach(el => {
            el.style.removeProperty('color');
            el.removeAttribute('data-nuc');
          });
          // SAFETY: remove ANY lingering inline color on info card elements
          document.querySelectorAll('[class*="bg-[#240046]/30"] span, [class*="bg-[#240046]/30"] p').forEach(el => {
            el.style.removeProperty('color');
          });
        }

        // Modal stacking fix (JS fallback for browsers without :has())
        function checkModalStacking() {
          const mainEl = document.querySelector('main');
          const modal = mainEl && mainEl.querySelector('.fixed.inset-0.z-50');
          const parent = mainEl && mainEl.parentElement;
          if (modal) {
            if (mainEl && !mainEl.classList.contains('modal-active')) mainEl.classList.add('modal-active');
            if (parent && !parent.classList.contains('modal-active-parent')) parent.classList.add('modal-active-parent');
          } else {
            if (mainEl) mainEl.classList.remove('modal-active');
            if (parent) parent.classList.remove('modal-active-parent');
          }
        }

        // MutationObserver for React re-renders
        let patchTimeout;
        const observer = new MutationObserver(() => {
          clearTimeout(patchTimeout);
          patchTimeout = setTimeout(() => {
            patchInlineStyles();
            checkModalStacking();
          }, 50);
        });

        function startObserver() {
          const root = document.getElementById('root');
          if (root) {
            observer.observe(root, { 
              childList: true, subtree: true, 
              attributes: true, attributeFilter: ['style', 'class'] 
            });
          }
        }

        // Theme override for pages that must stay dark (e.g. ID Card)
        var _themeOverride = null;

        function applyTheme(mode, animate) {
          // Block theme changes during override
          if (_themeOverride !== null) return;

          if (animate) {
            overlay.style.background = mode === 'light'
              ? 'rgba(247,248,252,0.97)'
              : 'rgba(16,0,43,0.97)';
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 450);
          }

          if (mode === 'light') {
            html.classList.add('light-mode');
            // Run patches with delays to catch React renders
            setTimeout(patchInlineStyles, 30);
            setTimeout(patchInlineStyles, 150);
            setTimeout(patchInlineStyles, 500);
            startObserver();
          } else {
            observer.disconnect();
            unpatchInlineStyles();
            html.classList.remove('light-mode');
          }
          setStoredTheme(mode);
        }

        // Force theme override (used by ID card page)
        window.__basForceThemeOverride = function(mode) {
          if (mode === 'dark') {
            _themeOverride = 'dark';
            observer.disconnect();
            unpatchInlineStyles();
            html.classList.remove('light-mode');
          } else if (mode === null) {
            _themeOverride = null;
            var saved = getStoredTheme();
            if (saved === 'light') {
              html.classList.add('light-mode');
              setTimeout(patchInlineStyles, 30);
              setTimeout(patchInlineStyles, 150);
              setTimeout(patchInlineStyles, 500);
              startObserver();
            }
          }
        };

        btn.addEventListener('click', function() {
          if (_themeOverride !== null) return; // Ignore toggle during override
          const isLight = html.classList.contains('light-mode');
          applyTheme(isLight ? 'dark' : 'light', true);
        });
        btn.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
        });

        // Init
        const saved = getStoredTheme();
        if (saved) {
          applyTheme(saved, false);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          applyTheme('light', false);
        }

        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
            if (!getStoredTheme()) applyTheme(e.matches ? 'light' : 'dark', true);
          });
        }

        // Robust: patch on full load and after React hydration
        window.addEventListener('load', () => {
          if (html.classList.contains('light-mode')) {
            setTimeout(patchInlineStyles, 100);
            setTimeout(patchInlineStyles, 500);
            setTimeout(patchInlineStyles, 2000);
          }
        });

        // Expose for settings panel
        window.__basApplyTheme = applyTheme;

        // Show/hide toggle button based on login screen presence
        function updateToggleVisibility() {
          var loginScreen = document.querySelector('.min-h-screen.flex.items-center.justify-center');
          var header = document.querySelector('header');
          if (loginScreen && !header) {
            btn.style.setProperty('display', 'flex', 'important');
          } else {
            btn.style.setProperty('display', 'none', 'important');
          }
        }
        updateToggleVisibility();
        var visObs = new MutationObserver(updateToggleVisibility);
        visObs.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
      })();
    </script>

    <!-- Settings Panel Script -->
    <script>
      (function() {
        'use strict';
        var settingsPanel = document.getElementById('settings-panel');
        var themeItem = document.getElementById('settings-theme-item');
        var themeDesc = document.getElementById('settings-theme-desc');
        var switchIcon = document.getElementById('settings-switch-icon');
        var logoutBtn = document.getElementById('settings-logout-btn');
        var html = document.documentElement;

        function updateThemeToggle() {
          var isLight = html.classList.contains('light-mode');
          themeDesc.textContent = isLight ? 'Mode Terang' : 'Mode Gelap';
          switchIcon.textContent = isLight ? '🌙' : '☀️';
        }

        themeItem.addEventListener('click', function() {
          var isLight = html.classList.contains('light-mode');
          if (window.__basApplyTheme) {
            window.__basApplyTheme(isLight ? 'dark' : 'light', true);
          }
          setTimeout(updateThemeToggle, 150);
        });

        logoutBtn.addEventListener('click', function() {
          // Tutup settings panel dulu
          hideSettings();

          // Clear session langsung
          localStorage.removeItem('bas_session');

          // Coba klik tombol logout asli React
          var origLogout = document.querySelector('header .justify-between > button');
          if (origLogout) {
            // Buat visible sementara agar clickable
            origLogout.style.cssText = 'position:static!important;width:auto!important;height:auto!important;clip:auto!important;overflow:visible!important;margin:0!important;opacity:0;pointer-events:auto;';
            origLogout.click();
            // Monitor apakah React sudah handle logout (login form muncul)
            var checkCount = 0;
            var checkLogout = setInterval(function() {
              checkCount++;
              var loginForm = document.querySelector('form') || document.querySelector('input[type="text"]');
              var headerGone = !document.querySelector('header');
              if (loginForm || headerGone || checkCount > 20) {
                clearInterval(checkLogout);
                // Jika React belum handle setelah 2 detik, force reload
                if (checkCount > 20) {
                  location.reload();
                }
              }
            }, 100);
          } else {
            // Tidak ketemu tombol React, langsung reload
            location.reload();
          }
        });



        function getAppContainer() {
          return document.querySelector('.max-w-md') || document.querySelector('#root > div');
        }

        function showSettings() {
          // Pindahkan panel ke dalam container app supaya ikut layout
          var container = getAppContainer();
          if (container && settingsPanel.parentNode !== container) {
            container.appendChild(settingsPanel);
          }
          settingsPanel.classList.add('active');
          html.classList.add('settings-panel-open');
          updateThemeToggle();
        }
        function hideSettings() {
          settingsPanel.classList.remove('active');
          html.classList.remove('settings-panel-open');
          var navBtn = document.getElementById('settings-nav-btn');
          if (navBtn) navBtn.classList.remove('active');
        }

        function injectSettingsTab() {
          var nav = document.querySelector('nav[class*="fixed"][class*="bottom-0"]');
          if (!nav) return false;
          var flex = nav.querySelector('.flex');
          if (!flex) return false;
          if (flex.querySelector('#settings-nav-btn')) return true;

          var btn = document.createElement('button');
          btn.id = 'settings-nav-btn';
          btn.className = 'flex flex-col items-center justify-center w-full h-full group relative outline-none active:scale-90';
          btn.style.cssText = 'transition:all 0.3s ease;';
          btn.innerHTML =
            '<div class="nav-active-indicator absolute top-0 w-12 h-1.5 bg-gradient-to-r from-[#f72585] to-[#7209b7] rounded-b-full shadow-[0_0_15px_#f72585]"></div>' +
            '<div class="nav-icon-wrap mb-1 p-2 rounded-2xl text-slate-500 group-hover:scale-105" style="transition:all 0.3s ease;">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/>' +
                '<line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/>' +
                '<line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/>' +
                '<line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/>' +
                '<line x1="18" x2="22" y1="16" y2="16"/>' +
              '</svg>' +
            '</div>' +
            '<span class="nav-label text-[10px] font-black uppercase tracking-tighter text-slate-600 opacity-0 group-hover:opacity-100" style="transition:all 0.3s ease;">Pengaturan</span>';

          flex.appendChild(btn);

          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (settingsPanel.classList.contains('active')) {
              hideSettings();
            } else {
              showSettings();
              btn.classList.add('active');
            }
          });

          return true;
        }

        var injected = false;
        function tryInject() {
          if (!injected && injectSettingsTab()) injected = true;
        }
        tryInject();
        [300, 800, 1500, 3000, 5000].forEach(function(ms) { setTimeout(tryInject, ms); });

        var bodyObs = new MutationObserver(function() {
          if (!injected) { tryInject(); return; }
          if (!document.getElementById('settings-nav-btn')) { injected = false; tryInject(); }
        });
        bodyObs.observe(document.body, { childList: true, subtree: true });

        // Event delegation: klik tab lain di nav = tutup settings
        // Ini lebih robust karena tidak hilang saat React re-render
        document.addEventListener('click', function(e) {
          if (!settingsPanel.classList.contains('active')) return;
          var navBtn = e.target.closest('nav[class*="fixed"][class*="bottom-0"] button');
          if (navBtn && navBtn.id !== 'settings-nav-btn') {
            hideSettings();
          }
        }, true);

        new MutationObserver(function() {
          if (settingsPanel.classList.contains('active')) updateThemeToggle();
        }).observe(html, { attributes: true, attributeFilter: ['class'] });

        updateThemeToggle();
      })();
    </script>

    <!-- PAYSLIP PNG TEMPLATE ENHANCER -->
    <script>

        function enhanceTemplate(templateDiv) {
          if (!templateDiv) return;
          if (templateDiv.dataset.enhanced) return;
          templateDiv.dataset.enhanced = '1';

          // === 1. Inject logo into header ===
          var header = templateDiv.querySelector('.text-center.mb-6');
          if (header) {
            if (!header.querySelector('.bas-logo-injected')) {
              var logoWrap = document.createElement('div');
              logoWrap.className = 'bas-logo-injected';
              logoWrap.style.cssText = 'display:flex;align-items:center;justify-content:center;margin-bottom:10px;';
              var logo = document.createElement('img');
              logo.src = BAS_LOGO;
              logo.style.cssText = 'width:56px;height:56px;border-radius:50%;border:3px solid rgba(255,255,255,0.25);';
              logoWrap.appendChild(logo);
              var h2 = header.querySelector('h2');
              if (h2) header.insertBefore(logoWrap, h2);
            }

            // Tagline below company name
            var pLabel = header.querySelector('p');
            if (pLabel && !header.querySelector('.bas-tagline')) {
              var tagline = document.createElement('div');
              tagline.className = 'bas-tagline';
              tagline.style.cssText = 'color:rgba(199,210,254,0.65);font-size:7px;letter-spacing:0.1em;margin-top:2px;margin-bottom:8px;font-weight:600;';
              tagline.textContent = 'Jasa Pengiriman & Logistik Terpercaya';
              header.insertBefore(tagline, pLabel);
            }
          }

          // === 2. Inject watermark at bottom ===
          var footer = templateDiv.querySelector('.mt-10');
          if (footer && !templateDiv.querySelector('.bas-watermark')) {
            var wm = document.createElement('div');
            wm.className = 'bas-watermark';
            wm.style.cssText = 'text-align:center;padding:8px 32px 12px;font-size:6px;color:#cbd5e1;letter-spacing:0.15em;font-weight:700;';
            wm.textContent = 'DOKUMEN INI DIGENERATE SECARA DIGITAL OLEH SISTEM SUPER-BAS';
            templateDiv.appendChild(wm);
          }
        }

        // Monitor for slip modal and enhance template
        function checkAndEnhance() {
          var modals = document.querySelectorAll('.fixed.inset-0.z-50');
          modals.forEach(function(modal) {
            var hidden = modal.querySelector('.absolute.top-0.left-0.w-full');
            if (!hidden) return;
            var tpl = hidden.querySelector('div[style*="width"]');
            if (tpl) enhanceTemplate(tpl);
          });
        }

        var slipObs = new MutationObserver(checkAndEnhance);
        slipObs.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

            }
          }

          // 2. Hide bottom clutter (SECURE ACCESS TOKEN + dots) via DOM
          var bottomArea = card.querySelector('.absolute.bottom-0.w-full');
          if (bottomArea) {
            bottomArea.style.display = 'none';
          }
        }

        // Combined observer
        var cardObs = new MutationObserver(function() {
          var card = document.getElementById('card-capture-target');
          if (card && !card.dataset.cardEnhanced) enhanceIdCard();
        });
        cardObs.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <!-- LOGO AVATAR REPLACER: Replace Google Drive logos with local BAS logo -->
    <script>
      (function() {
        var LOCAL_LOGO = 'assets/bas1.svg';
        var DRIVE_PATTERN = 'drive.google.com/thumbnail';

        function replaceLogos() {
          var imgs = document.querySelectorAll('img[src*="' + DRIVE_PATTERN + '"]');
          imgs.forEach(function(img) {
            if (img.src.indexOf(DRIVE_PATTERN) !== -1) {
              img.src = LOCAL_LOGO;
              img.referrerPolicy = '';
            }
          });
        }

        // Replace "BAS" h1 text in header with transparent logo image
        function replaceHeaderBAS() {
          var h1 = document.querySelector('header h1');
          if (!h1 || h1.dataset.basReplaced) return;
          if (h1.textContent.trim() !== 'BAS') return;
          h1.dataset.basReplaced = '1';
          var logo = document.createElement('img');
          logo.className = 'bas-header-logo';
          logo.alt = 'BAS';
          // Use white-on-transparent logo (same as ID card)
          logo.src = window.__BAS_WHITE_LOGO || LOCAL_LOGO;
          h1.textContent = '';
          h1.appendChild(logo);
          h1.style.cssText = 'display:flex !important;align-items:center !important;background:none !important;-webkit-text-fill-color:initial !important;';
        }

        replaceLogos();
        replaceHeaderBAS();
        var logoObs = new MutationObserver(function() {
          replaceLogos();
          replaceHeaderBAS();
          // Force numeric keyboard on login inputs (OPS ID & NIK)
          document.querySelectorAll('.max-w-sm input').forEach(function(inp) {
            if (!inp.dataset.numFixed) {
              inp.inputMode = 'numeric';
              inp.pattern = '[0-9]*';
              inp.dataset.numFixed = '1';
            }
          });
        });
        logoObs.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

</body>
