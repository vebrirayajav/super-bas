      <div class="glass rounded-2xl p-4 sm:p-5">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-cyan"></span>Neural Network Training Loss</h3>
        <p class="text-[9px] text-slate-600 font-medium mb-3">Epoch vs MSE Loss — Adam Optimizer + Leaky ReLU</p>
        <div class="h-56 sm:h-72"><canvas id="cDSLoss"></canvas></div>
      </div>
    </div>

    <!-- Cluster Visualization + PCA -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 fade-up" style="animation-delay:240ms">
      <div class="glass rounded-2xl p-4 sm:p-5">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-blue"></span>K-Means++ Cluster Visualization</h3>
        <p class="text-[9px] text-slate-600 font-medium mb-3">Silhouette Score: ${silScore.toFixed(3)} | WCSS: ${salCluster?.wcss?.toFixed(0)||'—'}</p>
        <div class="h-52 sm:h-64"><canvas id="cDSClust"></canvas></div>
      </div>
      <div class="glass rounded-2xl p-4 sm:p-5">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-green"></span>PCA Dimensionality Reduction</h3>
        <p class="text-[9px] text-slate-600 font-medium mb-3">Principal Component Analysis — Employee Feature Space</p>
        <div class="h-52 sm:h-64"><canvas id="cDSPCA"></canvas></div>
      </div>
    </div>

    <!-- Time Series DL Forecast -->
    <div class="glass rounded-2xl p-4 sm:p-5 fade-up" style="animation-delay:270ms">
      <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-orange"></span>Neural Time Series Forecast</h3>
      <p class="text-[9px] text-slate-600 font-medium mb-3">Feedforward NN Forecaster — Window-based sequence prediction</p>
      <div class="h-52 sm:h-64"><canvas id="cDSForecast"></canvas></div>
    </div>

    <!-- Feature Importance -->
    <div class="glass rounded-2xl p-4 sm:p-5 fade-up" style="animation-delay:290ms">
      <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-pink"></span>Feature Importance — Permutation-based</h3>
      <p class="text-[9px] text-slate-600 font-medium mb-3">Which factors matter most for salary prediction</p>
      <div class="h-48 sm:h-56"><canvas id="cDSFeatImp"></canvas></div>
    </div>

    <!-- Autoencoder Anomaly Detection Chart -->
    <div class="glass rounded-2xl p-4 sm:p-5 fade-up" style="animation-delay:310ms">
      <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>Autoencoder Anomaly Detection</h3>
      <p class="text-[9px] text-slate-600 font-medium mb-3">Reconstruction error per data point — anomalies marked in red</p>
      <div class="h-48 sm:h-56"><canvas id="cDSAnomaly"></canvas></div>
    </div>

    <!-- Descriptive Statistics -->
    <div class="glass rounded-2xl p-4 sm:p-5 fade-up" style="animation-delay:330ms">
      <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent-orange"></span>Advanced Descriptive Statistics</h3>
      <div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="border-b border-white/5">
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-left">Variable</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right">N</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right">Mean</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right">Median</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right">Std</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right hidden sm:table-cell">Min</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right hidden sm:table-cell">Max</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right hidden md:table-cell">IQR</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right hidden md:table-cell">Skew</th>
        <th class="px-4 py-3 font-bold text-slate-500 uppercase text-right hidden lg:table-cell">Kurt</th>
      </tr></thead><tbody>
        ${statsRow('Gaji',ss,true)}
        ${statsRow('Presensi',as,false)}
        ${statsRow('Hari Kerja',hs,false)}
      </tbody></table></div>
    </div>
  `;

  // Async DL training
  setTimeout(()=>{
    // 1. Regression scatter: Linear + Poly + Neural
    if(hkSal.length>2){
      const sc=hkSal.map(([x,y])=>({x,y}));
      const mn=Math.min(...hkSal.map(d=>d[0])),mx=Math.max(...hkSal.map(d=>d[0]));
      const datasets=[
        {label:'Data',data:sc,backgroundColor:C.cy,pointRadius:3,pointHoverRadius:6},
        {label:'Linear (R²='+hkR.r2.toFixed(3)+')',type:'line',data:[{x:mn,y:hkR.predict(mn)},{x:mx,y:hkR.predict(mx)}],borderColor:C.pk,borderDash:[5,5],borderWidth:2,pointRadius:0,fill:false}
      ];
      if(polyR.predict){
        const steps=25;const xStep=(mx-mn)/steps;
        const pLine=[];for(let i=0;i<=steps;i++){const x=mn+i*xStep;pLine.push({x,y:polyR.predict(x)});}
        datasets.push({label:'Poly d=2 (R²='+polyR.r2.toFixed(3)+')',type:'line',data:pLine,borderColor:C.or,borderDash:[8,4],borderWidth:2,pointRadius:0,fill:false});
      }
      // Train a neural network for regression
      if(hkSal.length>5){
        try{
          const {normalized,mins,maxs,ranges}=DL.normalize(hkSal);
          const X=normalized.map(d=>[d[0]]),Y=normalized.map(d=>[d[1]]);
          const nn=DL.createNN([1,12,8,1],{lr:0.008,activation:'relu',dropout:0.05});
          const history=nn.train(X,Y,200);

          // Neural predictions
          const steps=30;const xStep=(mx-mn)/steps;
          const nnLine=[];
          for(let i=0;i<=steps;i++){
            const x=mn+i*xStep;
            const xn=(x-mins[0])/ranges[0];
            const yn=nn.predict([xn])[0];
            nnLine.push({x,y:yn*ranges[1]+mins[1]});
          }
          datasets.push({label:'Neural NN',type:'line',data:nnLine,borderColor:C.pr,borderWidth:2,pointRadius:0,fill:false});

          // Update NN info card
          const finalLoss=history.loss[history.loss.length-1];
          document.getElementById('dsNNInfo').innerHTML=`
            <div class="flex justify-between"><span class="text-slate-400">Architecture</span><span class="text-white font-mono font-bold text-[10px]">1→12→8→1</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Optimizer</span><span class="text-accent-cyan font-bold">Adam (β₁=0.9)</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Activation</span><span class="text-accent-green font-bold">Leaky ReLU</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Epochs</span><span class="text-white font-bold">200</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Final Loss</span><span class="text-accent-pink font-bold">${finalLoss.toFixed(6)}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Dropout</span><span class="text-accent-orange font-bold">5%</span></div>
          `;

          // Loss chart
          mkChart('cDSLoss',{type:'line',data:{labels:history.loss.map((_,i)=>i+1),datasets:[
            {label:'Training Loss (MSE)',data:history.loss,borderColor:C.pk,backgroundColor:C.pkB,fill:true,tension:0.3,pointRadius:0,borderWidth:2}
          ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,font:{size:9,weight:'600'}}}},scales:{x:{title:{display:true,text:'Epoch',font:{size:9}},ticks:{font:{size:8},maxTicksLimit:20}},y:{title:{display:true,text:'MSE Loss',font:{size:9}},ticks:{font:{size:8}}}}}});

          // Feature Importance
          const fNames=['Hari Kerja'];
          const fImp=DL.featureImportance(X,Y,nn,fNames);
          mkChart('cDSFeatImp',{type:'bar',data:{labels:fImp.map(f=>f.feature),datasets:[{label:'Importance',data:fImp.map(f=>f.importance),backgroundColor:C.multi.map(c=>c.replace('1)','0.5)')),borderColor:C.multi,borderWidth:1,borderRadius:8}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{font:{size:8}}},y:{ticks:{font:{size:10,weight:'600'}}}}}});
        }catch(e){console.warn('DL NN training error:',e);}
      }
      mkChart('cDSReg',{type:'scatter',data:{datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:10,font:{size:9,weight:'600'}}}},scales:{x:{title:{display:true,text:'Hari Kerja',font:{size:9}},ticks:{font:{size:8}}},y:{title:{display:true,text:'Total Gaji',font:{size:9}},ticks:{callback:v=>fmt(v),font:{size:8}}}}}});
    }

    // 2. Cluster visualization
    if(salCluster){
      const cn=salCluster.centroids.map((c,i)=>'C'+(i+1)+' ('+fmt(Array.isArray(c)?c[0]:c)+')');
      const bc=[C.pk,C.bl,C.gn];
      mkChart('cDSClust',{type:'bar',data:{labels:cn,datasets:[{data:salCluster.clusters.map(c=>c.length),backgroundColor:bc.map(c=>c.replace('1)','0.25)')),borderColor:bc,borderWidth:2,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:8}}},x:{ticks:{font:{size:8}}}}}});
    }

    // 3. PCA Visualization
    if(employees.length>3){
      try{
        const featureData=employees.map(e=>{
          const att=attMap[e.opsId]||[];
          const pay=payMap[e.opsId]||[];
          return[
            att.length,
            pay.reduce((s,p)=>s+(p.totalDibayarkan||0),0)/Math.max(1,pay.length),
            pay.reduce((s,p)=>s+(p.hk||0),0)/Math.max(1,pay.length)
          ];
        });
        const {normalized}=DL.normalize(featureData);
        const pca=DL.pca(normalized,2);
        const scData=pca.transformed.map((t,i)=>({x:t[0]||0,y:t[1]||0,label:employees[i].name}));
        mkChart('cDSPCA',{type:'scatter',data:{datasets:[
          {label:'PC1 vs PC2',data:scData,backgroundColor:C.multi.map(c=>c.replace('1)','0.6)')),pointRadius:5,pointHoverRadius:8}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>(ctx.raw.label||'')}}},scales:{x:{title:{display:true,text:'PC1'+(pca.explained[0]?' ('+pca.explained[0].toFixed(1)+'%)':''),font:{size:9}},ticks:{font:{size:8}}},y:{title:{display:true,text:'PC2'+(pca.explained[1]?' ('+pca.explained[1].toFixed(1)+'%)':''),font:{size:9}},ticks:{font:{size:8}}}}}});
      }catch(e){console.warn('PCA error:',e);}
    }

    // 4. Time Series Neural Forecast
    if(pVals.length>=4){
      try{
        const wSize=Math.min(3,pVals.length-1);
        const tsnn=DL.createTSNN(wSize,10,0.01);
        const tsHistory=tsnn.train(pVals,200);
        const fcSteps=3;
        const forecast=tsnn.forecast(pVals,fcSteps);
        const lbl=[...periods,...Array.from({length:fcSteps},(_,i)=>'Pred+'+(i+1))];
        const actual=[...pVals,...new Array(fcSteps).fill(null)];
        const predicted=[...new Array(pVals.length).fill(null),...forecast];
        // Also add ES for comparison
        const es=ML.expSmooth(pVals,0.3,fcSteps);
        mkChart('cDSForecast',{type:'line',data:{labels:lbl,datasets:[
          {label:'Aktual',data:actual,borderColor:C.cy,backgroundColor:C.cyB,fill:true,tension:0.4,pointRadius:3,borderWidth:2},
          {label:'Neural DL',data:predicted,borderColor:C.pr,borderWidth:2.5,pointRadius:5,pointBackgroundColor:C.pr,fill:false},
          {label:'Exp.Smoothing',data:es.slice(0,lbl.length),borderColor:C.gn,borderDash:[5,5],borderWidth:2,pointRadius:0,fill:false}
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{usePointStyle:true,padding:10,font:{size:9,weight:'600'}}}},scales:{y:{ticks:{callback:v=>fmt(v),font:{size:8}}},x:{ticks:{font:{size:8}}}}}});

        // Update TS info card
        document.getElementById('dsTSInfo').innerHTML=`
          <div class="flex justify-between"><span class="text-slate-400">Window Size</span><span class="text-white font-bold">${wSize}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Architecture</span><span class="text-white font-mono font-bold text-[10px]">${wSize}→10→5→1</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Epochs</span><span class="text-white font-bold">200</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Final Loss</span><span class="text-accent-pink font-bold">${tsHistory.loss[tsHistory.loss.length-1]?.toFixed(6)||'N/A'}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Forecast</span><span class="text-accent-green font-bold">${fcSteps} periods</span></div>
        `;
      }catch(e){console.warn('TS forecast error:',e);}
    }

    // 5. Autoencoder Anomaly Detection
    if(salaries.length>5){
      try{
        const salNorm=salaries.map(s=>[s/Math.max(...salaries)]);
        const ae=DL.createAutoencoder(1,1,0.01);
        ae.train(salNorm,100);
        const result=ae.detect(salNorm);
        const anomCount=result.errors.filter(e=>e.isAnomaly).length;
        document.getElementById('dsAEAnomalyCount').textContent=anomCount+' anomali';
        document.getElementById('dsAEAnomalyCount').className='font-bold '+(anomCount>0?'text-red-400':'text-accent-green');

        // Update AE info card
        document.getElementById('dsAEInfo').innerHTML=`
          <div class="flex justify-between"><span class="text-slate-400">Architecture</span><span class="text-white font-mono font-bold text-[10px]">1→1→1→1→1</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Bottleneck</span><span class="text-accent-cyan font-bold">1 neuron</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Threshold</span><span class="text-white font-bold">${result.threshold.toFixed(6)}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Anomalies</span><span class="${anomCount>0?'text-red-400':'text-accent-green'} font-bold">${anomCount} / ${salaries.length}</span></div>
          <div class="flex justify-between"><span class="text-slate-400">MSE μ±σ</span><span class="text-accent-orange font-bold">${result.mean.toFixed(6)}±${result.std.toFixed(6)}</span></div>
        `;

        // Anomaly chart
        mkChart('cDSAnomaly',{type:'bar',data:{labels:result.errors.map((_,i)=>'#'+(i+1)),datasets:[{label:'Reconstruction Error',data:result.errors.map(e=>e.mse),backgroundColor:result.errors.map(e=>e.isAnomaly?'rgba(239,68,68,0.6)':'rgba(76,201,240,0.3)'),borderColor:result.errors.map(e=>e.isAnomaly?'rgba(239,68,68,1)':'rgba(76,201,240,0.8)'),borderWidth:1,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},annotation:{}},scales:{y:{ticks:{font:{size:8}},title:{display:true,text:'MSE',font:{size:9}}},x:{ticks:{font:{size:6},maxTicksLimit:30}}}}});
      }catch(e){console.warn('Autoencoder error:',e);}
    }
  },120);
}

function statsRow(label,s,isCurrency){
  const f=isCurrency?fmt:v=>v.toFixed(2);
  return `<tr class="trow border-b border-white/[0.02]"><td class="px-4 py-3 font-semibold text-white">${label}</td><td class="px-4 py-3 text-right text-slate-400">${s.n}</td><td class="px-4 py-3 text-right font-mono text-accent-cyan text-[10px]">${f(s.mean)}</td><td class="px-4 py-3 text-right font-mono text-slate-300 text-[10px]">${f(s.median)}</td><td class="px-4 py-3 text-right font-mono text-slate-300 text-[10px]">${f(s.std)}</td><td class="px-4 py-3 text-right font-mono text-slate-400 text-[10px] hidden sm:table-cell">${f(s.min)}</td><td class="px-4 py-3 text-right font-mono text-slate-400 text-[10px] hidden sm:table-cell">${f(s.max)}</td><td class="px-4 py-3 text-right font-mono text-slate-400 text-[10px] hidden md:table-cell">${f(s.iqr)}</td><td class="px-4 py-3 text-right font-mono text-slate-400 text-[10px] hidden md:table-cell">${(s.skewness||0).toFixed(2)}</td><td class="px-4 py-3 text-right font-mono text-slate-400 text-[10px] hidden lg:table-cell">${(s.kurtosis||0).toFixed(2)}</td></tr>`;
}

function makeQR(text, size) {
  var qr = qrcode(0, 'H');
  qr.addData(text);
  qr.make();
  var modules = qr.getModuleCount();
  var cellSize = Math.floor(size / modules);
  var canvas = document.createElement('canvas');
  canvas.width = cellSize * modules;
  canvas.height = cellSize * modules;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000000';
  for (var r = 0; r < modules; r++) {
    for (var c = 0; c < modules; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
    }
  }
  return canvas.toDataURL('image/png');
}

function switchIDMode(mode) {
  idcardMode = mode;
  document.getElementById('mSingle').classList.toggle('active', mode === 'single');
  document.getElementById('mBulk').classList.toggle('active', mode === 'bulk');
  document.getElementById('idSingle').classList.toggle('hidden', mode !== 'single');
  document.getElementById('idBulk').classList.toggle('hidden', mode !== 'bulk');
}

function autoFillCard() {
  const opsId = document.getElementById('icAutoFill').value;
  if (!opsId) return;
  const emp = employees.find(e => e.opsId === opsId);
  if (!emp) return;
  document.getElementById('icName').value = emp.name || '';
  document.getElementById('icOpsId').value = emp.opsId || '';
}

function clearSingleForm() {
  ['icName','icOpsId'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('icAutoFill').value = '';
}

function generateSingleCard() {
  const name = document.getElementById('icName').value.trim();
  const rawId = document.getElementById('icOpsId').value.trim();
  if (!name || !rawId) { alert('Nama dan OPS ID wajib diisi!'); return; }
  const opsId = formatOpsId(rawId);
  const data = [{
    name, opsId,
    position: 'Daily Worker'
  }];
  idcardPreviewData = data;
  renderCardPreview(data);
}

function detectOpsId(val) {
  return /^ops/i.test(val) || /^\d{4,}$/.test(val);
}

function formatOpsId(val) {
  val = val.trim();
  if (/^\d+$/.test(val)) return 'Ops' + val;
  if (/^ops/i.test(val)) return 'Ops' + val.replace(/^ops/i, '');
  return val;
}

function sortCardData(data, sortBy) {
  const sorted = [...data];
  if (sortBy === 'name') sorted.sort((a, b) => a.name.localeCompare(b.name, 'id'));
  else if (sortBy === 'opsId') sorted.sort((a, b) => a.opsId.localeCompare(b.opsId));
  return sorted;
}

let bulkSortBy = 'name';

function reSortBulk(sortBy) {
  bulkSortBy = sortBy;
  if (!idcardPreviewData.length) return;
  idcardPreviewData = sortCardData(idcardPreviewData, sortBy);
  showBulkTable(idcardPreviewData);
  renderCardPreview(idcardPreviewData);
}

function parseBulkData() {
  const raw = document.getElementById('bulkPaste').value.trim();
  if (!raw) { alert('Paste data terlebih dahulu!'); return; }
  const lines = raw.split('\n').map(l => l.split('\t').map(c => c.trim())).filter(l => l.length >= 2 && l[0]);

  if (!lines.length) { alert('Data tidak valid. Pastikan minimal 2 kolom (Nama, OPS ID) dipisah Tab.'); return; }

  let startIdx = 0;
  const firstRow = lines[0].map(c => c.toLowerCase());
  if (firstRow.some(c => ['nama','name','ops','opsid','ops id'].includes(c))) startIdx = 1;

  // Auto-detect column order: check if first data column looks like OPS ID
  const sampleRow = lines[startIdx];
  let nameCol = 0, opsCol = 1;
  if (sampleRow && detectOpsId(sampleRow[0]) && !detectOpsId(sampleRow[1])) {
    nameCol = 1; opsCol = 0; // columns are swapped
  }

  const data = [];
  for (let i = startIdx; i < lines.length; i++) {
    const l = lines[i];
    const name = (l[nameCol] || '').trim();
    const rawId = (l[opsCol] || '').trim();
    if (!name || !rawId) continue;
    const opsId = formatOpsId(rawId);
    data.push({
      name,
      opsId,
      position: 'Daily Worker'
    });
  }

  if (!data.length) { alert('Tidak ada data valid yang terdeteksi.'); return; }

  // Auto-sort by name (A-Z)
  bulkSortBy = 'name';
  const sorted = sortCardData(data, bulkSortBy);
  idcardPreviewData = sorted;
  showBulkTable(sorted);
  renderCardPreview(sorted);
}

// ── Helper: ensure html2canvas is loaded ──
async function ensureHtml2Canvas() {
  if (!window.html2canvas) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }
}

// ── Helper: render all cards to canvas array ──
async function renderAllCardsToCanvas() {
  await ensureHtml2Canvas();
  const cards = document.querySelectorAll('#printArea .id-card');
  const results = [];
  for (const card of cards) {
    const opsId = card.dataset.opsid || 'card';
    try {
      const canvas = await html2canvas(card, {
        backgroundColor: '#0d0025',
        scale: 3,
        useCORS: true,
        logging: false,
        width: 300,
        height: 480
      });
      results.push({ opsId, canvas });
    } catch(e) { console.error('Render error:', e); }
  }
  return results;
}

// ══════════ DOWNLOAD PNG (satu per satu) ══════════
async function downloadAllCards() {
  if (!idcardPreviewData.length) return;
  const items = await renderAllCardsToCanvas();
  for (const { opsId, canvas } of items) {
    const link = document.createElement('a');
    link.download = 'KARTU_IDENTITAS_' + opsId + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    await new Promise(r => setTimeout(r, 300));
  }
}

// ══════════ DOWNLOAD ZIP ══════════
async function downloadAsZip() {
  if (!idcardPreviewData.length) return;

  // Load JSZip
  if (!window.JSZip) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }

  const items = await renderAllCardsToCanvas();
  const zip = new JSZip();
  const folder = zip.folder('ID_Cards_BAS');

  for (const { opsId, canvas } of items) {
    const dataUrl = canvas.toDataURL('image/png');
    const base64 = dataUrl.split(',')[1];
    folder.file('KARTU_IDENTITAS_' + opsId + '.png', base64, { base64: true });
  }

  const blob = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = 'ID_Cards_BAS_' + new Date().toISOString().slice(0,10) + '.zip';
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

// ══════════ DOWNLOAD PDF ══════════
async function downloadAsPDF() {
  if (!idcardPreviewData.length) return;

  // Load jsPDF
  if (!window.jspdf) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }

  const items = await renderAllCardsToCanvas();
  const { jsPDF } = window.jspdf;

  // Card ratio 300:480 = 5:8. Use mm, fit full page per card, 0 margin.
  const cardW = 75; // mm
  const cardH = cardW * (480 / 300); // 120 mm
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [cardW, cardH] });

  for (let i = 0; i < items.length; i++) {
    if (i > 0) pdf.addPage([cardW, cardH], 'portrait');
    const imgData = items[i].canvas.toDataURL('image/png');
    pdf.addImage(imgData, 'PNG', 0, 0, cardW, cardH);
  }

  pdf.save('ID_Cards_BAS_' + new Date().toISOString().slice(0,10) + '.pdf');
}

async function runDiagnose(){
  const dr = document.getElementById('diagnoseResult');
  dr.innerHTML = '<p class="text-accent-cyan animate-pulse">⏳ Menjalankan diagnostik...</p>';
  
  try {
    // 1. Health Check
    let healthOk = false;
    try {
      const hc = await fetch(API, {method:'GET', headers:{'Accept':'application/json'}});
      if(hc.ok) {
        const hj = await hc.json();
        healthOk = hj && hj.status === 'ONLINE';
      }
    } catch(e) {}

    if(!healthOk) {
      dr.innerHTML = `
        <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 space-y-2">
          <p class="text-red-400 font-bold">❌ API TIDAK TERHUBUNG</p>
          <p>URL API tidak merespons atau tidak valid.</p>
          <p class="text-white">URL: <code class="text-accent-cyan/70 break-all">${API}</code></p>
          <p class="mt-2 font-bold text-accent-orange">Solusi:</p>
          <p>1. Pastikan sudah deploy Apps Script sebagai Web App</p>
          <p>2. Pastikan "Who has access" diset ke "Anyone"</p>
          <p>3. Paste URL deployment yang benar di kolom di atas</p>
        </div>`;
      return;
    }
    
    // 2. Diagnose sheets
    const diagResp = await api('diagnose');
    
    if(!diagResp || diagResp.error){
      dr.innerHTML = `
        <div class="p-3 rounded-xl bg-accent-orange/10 border border-accent-orange/30 space-y-2">
          <p class="text-accent-orange font-bold">⚠ API Online tapi DIAGNOSE gagal</p>
          <p class="text-slate-400">Error: ${diagResp?.error || 'Tidak ada respons'}</p>
          <p class="text-slate-400 mt-2">Kemungkinan Apps Script belum ter-deploy ulang setelah ditambahkan action 'diagnose'.</p>
          <p class="text-white font-bold">Solusi: Copy ulang APPS_SCRIPT_COMPLETE.gs ke Apps Script, lalu buat New Deployment.</p>
        </div>`;
      return;
    }
    
    // 3. Show results
    const required = ['Employees', 'Attendance', 'Payslips', 'DataOwner', 'SystemMessage'];
    const missing = diagResp.missingSheets || [];
    const sheetsHtml = (diagResp.sheets||[]).map(s => {
      const isRequired = required.includes(s.name);
      const statusColor = s.rows > 0 ? 'text-accent-green' : 'text-accent-orange';
      const statusIcon = s.rows > 0 ? '✅' : '⚠️';
      return `<tr class="trow border-b border-white/5">

      </tr>`;
    }).join('');
    
    const missingHtml = missing.length > 0 
      ? `<div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 mt-3">
          <p class="text-red-400 font-bold">❌ Sheet yang hilang: ${missing.join(', ')}</p>
          <p class="text-slate-400 mt-1">Klik tombol di bawah untuk membuat sheet yang hilang secara otomatis.</p>
          <button onclick="runSetup()" class="mt-2 px-4 py-2 rounded-xl bg-accent-pink/20 text-accent-pink text-xs font-bold border border-accent-pink/30 hover:bg-accent-pink/30 transition-all">
            🛠 Setup - Buat Sheet yang Hilang
          </button>
        </div>` 
      : '<p class="text-accent-green mt-3">✅ Semua sheet yang dibutuhkan sudah ada!</p>';
    
    const emptySheets = (diagResp.sheets||[]).filter(s => required.includes(s.name) && s.rows === 0);
    const emptyWarning = emptySheets.length > 0
      ? `<div class="p-3 rounded-xl bg-accent-orange/10 border border-accent-orange/30 mt-3">
          <p class="text-accent-orange font-bold">⚠ Sheet kosong (belum ada data):</p>
          <p class="text-slate-400 mt-1">${emptySheets.map(s=>s.name).join(', ')}</p>
          <p class="text-slate-400 mt-1">Pastikan data sudah diisi di Google Sheets, atau tambahkan data via menu Karyawan.</p>
        </div>` : '';
    
    dr.innerHTML = `
      <div class="space-y-3">
        <div class="p-3 rounded-xl bg-accent-green/10 border border-accent-green/30">
          <p class="text-accent-green font-bold">✅ API TERHUBUNG</p>

            </tr></thead>
            <tbody>${sheetsHtml}</tbody>
          </table>
        </div>
        ${missingHtml}
        ${emptyWarning}
      </div>`;
  } catch(e) {
    dr.innerHTML = `<div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30">
      <p class="text-red-400 font-bold">❌ Error: ${e.message}</p>
    </div>`;
  }
}

async function init(){
  // Check auth
  if(sessionStorage.getItem('bas_owner_auth')!=='true'){
    window.location.href='index.html';
    return;
  }
  
  // Apply role-based UI
  applyRoleUI();
  
  buildNav();
  const loaderEl=document.getElementById('loader');
  const loaderMsg=loaderEl?.querySelector('p');
  loaderEl?.classList.remove('hidden');
  if(loaderMsg) loaderMsg.textContent='Menghubungkan ke Database...';
  
  await loadAll();
  
  if(loaderMsg && dbStatus.connected) loaderMsg.textContent='Merender Dashboard & DL Engine...';
  loaderEl?.classList.add('hidden');
  go('overview');
}

function applyRoleUI() {
  const roleName = ownerProfile.nama || (isKorlap ? 'Korlap' : 'Owner');
  const roleLabel = isKorlap ? 'KORLAP' : 'OWNER';
  const roleColor = isKorlap ? 'accent-orange' : 'accent-pink';
  
  // Sidebar
  const st = document.getElementById('sidebarTitle');
  const ss = document.getElementById('sidebarSub');
  const rb = document.getElementById('sidebarRoleBadge');
  if (st) st.textContent = roleName;
  if (ss) ss.textContent = isKorlap ? korlapStation : 'Full Access';
  if (rb) {
    rb.classList.remove('hidden');
    rb.innerHTML = `<div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-${roleColor}/10 border border-${roleColor}/20">`
      + `<span class="w-1.5 h-1.5 rounded-full bg-${roleColor} animate-pulse"></span>`
      + `<span class="text-[9px] font-bold text-${roleColor} uppercase tracking-wider">${roleLabel}${isKorlap ? ' — ' + korlapStation : ''}</span>`
      + `</div>`;
  }
  
  // Mobile header
  const mt = document.getElementById('mobileTitle');
  const ms = document.getElementById('mobileSub');
  if (mt) mt.textContent = roleName;
  if (ms) ms.textContent = isKorlap ? 'Korlap — ' + korlapStation : 'Owner — Full Access';
}

init();
</script>
</body>
</html>
